<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headcount Sanity Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow card per screen, a quiet header with two tabs, and a wide scrolling table for the spec.
   Palette: cool paper grey with a deep green accent; brick red, amber and blue are reserved for stop, pause and data points. */
:root {
  color-scheme: light;
  --bg: #F2F5F3;
  --surface: #FFFFFF;
  --ink: #14221D;
  --muted: #58675F;
  --line: #D3DBD6;
  --accent: #1B6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0EFE9;
  --stop: #A8382A;
  --stop-soft: #F8E4E0;
  --pause: #7D5200;
  --pause-soft: #F7ECD3;
  --data: #2B5BA6;
  --data-soft: #E3ECF8;
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #16211D; --ink: #E5EDE9; --muted: #9AAAA3; --line: #2A3833;
    --accent: #5CC0A2; --accent-ink: #0B1411; --accent-soft: #1C3029;
    --stop: #EE8A7A; --stop-soft: #3A1F1B; --pause: #E6B35A; --pause-soft: #35290F;
    --data: #86AEEB; --data-soft: #1B2A44;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #16211D; --ink: #E5EDE9; --muted: #9AAAA3; --line: #2A3833;
  --accent: #5CC0A2; --accent-ink: #0B1411; --accent-soft: #1C3029;
  --stop: #EE8A7A; --stop-soft: #3A1F1B; --pause: #E6B35A; --pause-soft: #35290F;
  --data: #86AEEB; --data-soft: #1B2A44;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-inline: 16px; padding-block: 28px 64px;
}
.shell { max-width: 820px; margin: 0 auto; }
.top { margin-bottom: 20px; }
.eyebrow, .meta, .pill, .qn, th, .key, h3, .mono { font-family: var(--f-mono); }
.eyebrow { margin: 0 0 4px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0 0 14px; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.15; letter-spacing: -.01em; text-wrap: balance; }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.tabs button {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  padding: 8px 0; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; min-width: 0; }
.progress { height: 4px; background: var(--line); border-radius: 2px; margin: -4px 0 18px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.meta { margin: 0 0 10px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.q { margin: 0 0 8px; font-family: var(--f-display); font-weight: 600; font-size: clamp(1.3rem, 3.6vw, 1.7rem); line-height: 1.22; text-wrap: balance; }
.lead { margin: 0 0 16px; max-width: 62ch; }
.help { margin: 0 0 14px; color: var(--muted); font-size: .92rem; max-width: 62ch; }
.tags { margin: 0 0 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.band { margin: -24px -24px 18px; padding: 9px 24px; border-radius: 10px 10px 0 0; font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; }
.band.stop { background: var(--stop-soft); color: var(--stop); }
.band.pause { background: var(--pause-soft); color: var(--pause); }
.band.advice { background: var(--data-soft); color: var(--data); }
.band.done { background: var(--accent-soft); color: var(--accent); }
.progress + .band { margin-top: 0; }

.pill { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.pill.stop { color: var(--stop); border-color: var(--stop); }
.pill.pause { color: var(--pause); border-color: var(--pause); }
.pill.data, .pill.advice { color: var(--data); border-color: var(--data); }
.pill.proof { color: var(--accent); border-color: var(--accent); }

.legend { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 12px; }
.legend li { display: grid; grid-template-columns: 9.5rem 1fr; gap: 12px; align-items: baseline; }
.legend li > span:first-child { justify-self: start; }

.opts { display: grid; gap: 8px; margin: 4px 0 4px; }
.opt {
  appearance: none; display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
  padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  font: inherit; cursor: pointer;
}
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt .key { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 4px; font-size: .72rem; color: var(--muted); background: var(--surface); }
.opt.on .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

textarea, input[type="text"], input[type="date"] {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
textarea { resize: vertical; min-height: 7rem; }
.fields { display: grid; gap: 6px; }
.fl { display: block; margin: 10px 0 4px; font-weight: 500; font-size: .92rem; }
.fields .fl:first-child { margin-top: 0; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.actions.top { margin-top: 4px; margin-bottom: 14px; }
.paper { margin-top: 10px; font-size: .92rem; color: var(--muted); }
.paper:empty { display: none; }
.paper a, .linkbtn { color: var(--accent); text-decoration: underline; cursor: pointer; }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; font: inherit; }
#dlfb { margin-top: 4px; color: var(--accent); }
#dlfb:empty { display: none; }
.err { margin: 12px 0 0; color: var(--stop); font-size: .92rem; }
a.btn { display: inline-block; text-decoration: none; }
[hidden] { display: none !important; }
.btn {
  appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  padding: 9px 18px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#copyfb { font-size: .9rem; color: var(--accent); }
#copyfb:empty { display: none; }
#copyfb .help { color: var(--muted); }

.sum .block { margin-top: 18px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; }
.sum .block.data { background: var(--data-soft); border-color: var(--data); }
.sum .block.ok { background: var(--accent-soft); border-color: var(--accent); }
.sum .block.fix { background: var(--pause-soft); border-color: var(--pause); }
.verdict { margin: 0 0 6px; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; }
h3 { margin: 0 0 10px; font-size: .74rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h4 { margin: 14px 0 6px; font-family: var(--f-display); font-size: 1rem; }
.row { display: grid; grid-template-columns: 3.4rem 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.qn { font-size: .78rem; color: var(--muted); padding-top: 2px; }
.rp { margin: 0 0 2px; font-weight: 500; }
.ra { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.flags { margin: 0; padding-left: 1.2rem; }
.fb { margin-bottom: 4px; }
.fbsum { margin: 0 0 12px; max-width: 62ch; }
.fbwait { margin: 0 0 10px; }
.fbl { margin: 0 0 12px; padding-left: 1.2rem; display: grid; gap: 4px; max-width: 62ch; }
.check { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.check li { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 5px; accent-color: var(--accent); }

.sh { margin-top: 24px; }
.rules { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; max-width: 68ch; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: .88rem; }
th { text-align: left; padding: 9px 12px; font-size: .68rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg); }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
.nx { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.mono { font-size: .8rem; }

@media (max-width: 520px) {
  .card { padding: 18px; }
  .band { margin: -18px -18px 16px; padding-inline: 18px; }
  .legend li { grid-template-columns: 1fr; gap: 4px; }
  .row { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .top, .actions, #copyfb, #fbk, .progress { display: none !important; }
  .card, .sum .block { border-color: #999; background: #fff; }
  .band { background: #eee; color: #000; }
  .check input { accent-color: #000; }
}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <p class="eyebrow">For hiring managers</p>
    <h1>Headcount Sanity Check</h1>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="try" aria-selected="true">Try it</button>
      <button type="button" role="tab" data-tab="spec" aria-selected="false">Flow spec</button>
    </nav>
    <div id="paper" class="paper"></div>
  </header>
  <main id="app"></main>
</div>

<script>
const IN_CLAUDE = false;
const PDF_URL = "headcount-checklist.pdf";
const FLOW = {
  start: "q1",
  sections: {
    request: "The request",
    need: "The need",
    cover: "Other ways to cover the work",
    approval: "Timing and approval",
    details: "Role details"
  },
  /* Question numbers come from this list. Ids stay the same when questions are added or removed. */
  order: [
    "q1", "q1a", "q2", "a2", "q3", "q4", "q4a", "q5", "q6", "q6a",
    "q8", "q8a", "q9", "q10", "q10a", "q11", "q11a", "q11b", "q12", "q12a",
    "q13", "q13a", "q14", "q14a", "q15", "q15a", "q16", "q16a", "q16b",
    "q17", "q17a", "q18", "q18a",
    "q21", "q21a", "q22", "a22", "q22a", "q23", "q23a", "q24"
  ],
  nodes: {
    /* ---------- The request ---------- */
    q1: {
      section: "request", kind: "choice",
      prompt: "What kind of request is this?",
      options: [
        { label: "Replacing someone who left", go: "q1a" },
        { label: "A new role that is not in the approved plan", go: "q2" },
        { label: "Turning a contractor into an employee", go: "q2" }
      ]
    },
    q1a: {
      sub: "a", section: "request", kind: "choice",
      prompt: "Is the role still needed as written?",
      options: [
        { label: "Yes", go: "q2" },
        { label: "It needs changes", go: "q2", flag: "Replacement request: the manager says the role needs changes." },
        { label: "Not sure", go: "p1a" }
      ]
    },
    q2: {
      section: "request", kind: "choice",
      prompt: "How long will the work last?",
      options: [
        { label: "Under 6 months", go: "a2" },
        { label: "6 to 12 months", go: "q3" },
        { label: "12 months or more, ongoing", go: "q3" },
        { label: "I don't know", go: "p2" }
      ]
    },
    a2: {
      sub: "a", section: "request", kind: "choice", tone: "advice",
      prompt: "This may fit a contractor or vendor better",
      help: "Work that ends within 6 months usually costs less and carries less risk as contractor or vendor work than as a permanent hire.",
      options: [
        { label: "Try that instead", go: "s2" },
        { label: "I still need a full-time hire", go: "q3", flag: "Continued after advice: the work lasts under 6 months." }
      ]
    },

    /* ---------- The need ---------- */
    q3: {
      section: "need", kind: "text", dp: true, thin: 40,
      prompt: "In your own words, what does a long-term need mean for this role, and why does this role meet it?",
      help: "Your approver reads this to decide whether the demand will last. Be specific about what keeps the work coming.",
      next: "q4"
    },
    q4: {
      section: "need", kind: "choice",
      prompt: "Which goal does this hire move?",
      help: "Pick the goal this hire moves most.",
      options: [
        { label: "Grow revenue", go: "q4a" },
        { label: "Reduce costs", go: "q4a" },
        { label: "Reduce risk or meet a legal requirement", go: "q4a" },
        { label: "Keep customers", go: "q4a" },
        { label: "Launch something new", go: "q4a" },
        { label: "Keep current operations running", go: "q4a" },
        { label: "None of these", go: "s4" }
      ]
    },
    q4a: {
      sub: "a", section: "need", kind: "text", thin: 40,
      prompt: "How does this hire move that goal?",
      help: "Two to three sentences.",
      next: "q5"
    },
    q5: {
      section: "need", kind: "text", thin: 40,
      prompt: "What breaks if you do not make this hire?",
      help: "Describe what would stop, slow down, or go wrong.",
      next: "q6"
    },
    q6: {
      section: "need", kind: "choice", dp: true,
      prompt: "How long has this need existed?",
      help: "This never stops the form. It gives your approver context.",
      flagOn: {
        "1 to 3 years": "The team has had this need for 1 to 3 years.",
        "More than 3 years": "The team has had this need for more than 3 years."
      },
      options: [
        { label: "Under 3 months", go: "q6a" },
        { label: "3 to 12 months", go: "q6a" },
        { label: "1 to 3 years", go: "q6a" },
        { label: "More than 3 years", go: "q6a" }
      ]
    },
    q6a: {
      sub: "a", section: "need", kind: "text", dp: true, thin: 40,
      prompt: "How has the team covered the work so far?",
      help: "Say who has been doing it and what has been left undone. If this is a new need, say how you would cover it while you hire.",
      next: "q8"
    },
    q8: {
      section: "need", kind: "choice",
      prompt: "Is the workload caused by a broken process, tool, or approval step? Could fixing it remove the need?",
      options: [
        { label: "Yes, fixing it could remove the need", go: "s8" },
        { label: "Not sure", go: "p8" },
        { label: "No", go: "q8a" }
      ]
    },
    q8a: {
      sub: "a", section: "need", kind: "fields", evidence: true,
      verify: "Ask which process, tool, or approval step was checked.",
      prompt: "Why not? Show what you checked.",
      fields: [
        { id: "checked", label: "What you checked", type: "text" },
        { id: "who", label: "Who you asked", type: "text" },
        { id: "found", label: "What you found", type: "area", thin: 20 }
      ],
      next: "q9"
    },

    /* ---------- Other ways to cover the work ---------- */
    q9: {
      section: "cover", kind: "text", thin: 30,
      prompt: "List the tasks and duties this person would do.",
      help: "One per line. The next questions check these against your current team.",
      next: "q10"
    },
    q10: {
      section: "cover", kind: "choice",
      prompt: "Do any of these duties overlap with your own role or a current team member's?",
      options: [
        { label: "Yes", go: "q10a" },
        { label: "No", go: "q11" },
        { label: "Not sure", go: "p10" }
      ]
    },
    q10a: {
      sub: "a", section: "cover", kind: "fields", evidence: true,
      verify: "Confirm with the person named which tasks overlap and what capacity they have. If the manager named themselves, check what the manager is handing off.",
      prompt: "Which tasks overlap, and with whom? Include your own role.",
      fields: [
        { id: "who", label: "Person or team (write me for your own role)", type: "text" },
        { id: "tasks", label: "Overlapping tasks", type: "area" },
        { id: "why", label: "Why that person can't take on more", type: "area", thin: 20 }
      ],
      next: "q11"
    },
    q11: {
      section: "cover", kind: "choice",
      prompt: "How is the work divided across your current team?",
      help: "Your approver reads this next to the team survey results.",
      options: [
        { label: "Evenly, and I check it regularly", go: "q11a" },
        { label: "Mostly even, but I have not checked closely", go: "p11" },
        { label: "No, some people carry more", go: "q11b" },
        { label: "I have not looked", go: "p11" }
      ]
    },
    q11a: {
      sub: "a", section: "cover", kind: "fields", evidence: true,
      verify: "Ask to see the tracker, report, or numbers named.",
      prompt: "How do you check workload, and what did you find?",
      help: "Name the tool, meeting, or numbers you use. For example hours, tasks per person, or time off.",
      fields: [
        { id: "how", label: "How you check", type: "text" },
        { id: "when", label: "Last time you checked", type: "date" },
        { id: "found", label: "What you found", type: "area", thin: 20 }
      ],
      next: "q12"
    },
    q11b: {
      sub: "b", section: "cover", kind: "text", evidence: true, thin: 40,
      verify: "Check who carries more, and ask what changed after the manager acted.",
      prompt: "Who carries more, and what have you done to rebalance?",
      next: "q12"
    },
    q12: {
      section: "cover", kind: "choice", dp: true,
      prompt: "The committee will send an anonymous survey to your current team as part of this request. It will cover their current work-life balance, workload balancing, and fairness in work delegation. How do you feel about that?",
      help: "We will share the survey results with you, though you will not see individual answers. You will see only aggregated responses. Your team's answers will be considered by the committee.",
      flagOn: {
        "I have some concerns": "The manager has concerns about the team survey.",
        "I would rather it did not happen": "The manager would rather the team survey did not happen."
      },
      options: [
        { label: "That works for me", go: "q13" },
        { label: "I have some concerns", go: "q12a" },
        { label: "I would rather it did not happen", go: "q12a" }
      ]
    },
    q12a: {
      sub: "a", section: "cover", kind: "text", dp: true,
      prompt: "What are your concerns?",
      next: "q13"
    },
    q13: {
      section: "cover", kind: "choice",
      prompt: "Does another team need the same skills?",
      options: [
        { label: "Yes", go: "p13" },
        { label: "No", go: "q13a" },
        { label: "I don't know", go: "p13b" }
      ]
    },
    q13a: {
      sub: "a", section: "cover", kind: "fields", evidence: true,
      verify: "Confirm with the teams named that they do not need these skills.",
      prompt: "Who did you ask, when, and what happened?",
      fields: [
        { id: "who", label: "Who you asked", type: "text" },
        { id: "when", label: "When", type: "date" },
        { id: "found", label: "What happened", type: "area", thin: 20 }
      ],
      next: "q14"
    },
    q14: {
      section: "cover", kind: "choice",
      prompt: "Is anyone on your team or another team interested in learning and growing into this role?",
      options: [
        { label: "Yes", go: "s14" },
        { label: "No", go: "q14a" },
        { label: "I don't know, or I have not asked", go: "p14" }
      ]
    },
    q14a: {
      sub: "a", section: "cover", kind: "fields", evidence: true,
      verify: "Confirm the people named were asked and what they said.",
      prompt: "Who did you ask, when, and what happened?",
      fields: [
        { id: "who", label: "Who you asked", type: "text" },
        { id: "when", label: "When", type: "date" },
        { id: "found", label: "What happened", type: "area", thin: 20 }
      ],
      next: "q15"
    },
    q15: {
      section: "cover", kind: "choice",
      prompt: "Have you posted the job internally?",
      options: [
        { label: "No, not posted", go: "p15" },
        { label: "Yes, and someone is interested", go: "s15" },
        { label: "Yes, and no one applied or no one was qualified", go: "q15a" }
      ]
    },
    q15a: {
      sub: "a", section: "cover", kind: "fields", evidence: true,
      verify: "Open the posting. Check the dates it was open and the applicant results.",
      prompt: "Show the internal posting and what happened.",
      fields: [
        { id: "link", label: "Link to the posting", type: "text" },
        { id: "dates", label: "Dates it was open", type: "text" },
        { id: "found", label: "What happened", type: "area", thin: 20 }
      ],
      next: "q16"
    },
    q16: {
      section: "cover", kind: "choice",
      prompt: "Can AI or an automated tool do this job, fully or partly?",
      options: [
        { label: "Yes, mostly", go: "s16" },
        { label: "Partly", go: "q16a" },
        { label: "No", go: "q16b" },
        { label: "I am not sure", go: "s16b" }
      ]
    },
    q16a: {

  /* ---------- private feedback from Claude (Claude page only) ---------- */

      "",
      "Rules:",
      "- Do not predict whether it will be approved, and do not give a percentage or a score. You do not know this company's budget, headcount plan, or priorities. Say so where it matters.",
      "- Judge only what is written. Point out answers that are thin, vague, missing, or that disagree with each other.",

      '"gaps": an array of up to 5 strings, what is thin, missing, or inconsistent,',
      '"questions": an array of up to 5 strings, questions an approver is likely to ask,',

  function tidy(v) {
    v = v && typeof v === "object" ? v : {};

      return (Array.isArray(x) ? x : []).map(function (s) { return String(s == null ? "" : s).trim(); })
        .filter(Boolean).slice(0, max);
    };
    return {
      summary: String(v.summary == null ? "" : v.summary).trim(),
      strong: list(v.strong, 3), gaps: list(v.gaps, 5), questions: list(v.questions, 5), next: list(v.next, 3)
    };
  }
  function fbError(code) {
    if (code === "rate_limited") return "Too many requests, or your Claude usage limit is reached. Wait a while and try again.";
    if (code === "session_expired") return "Your Claude session ended. Sign in again, then try again.";
    if (code === "refused") return "Claude could not review this request as written. Change the wording and try again.";
    if (code === "prompt_too_large") return "This request is too long to review. Shorten your longest answers and try again.";
    return "The review did not work this time. Try again.";
  }
  function fbList(title, items) {

    } else if (f.status === "unavailable") {

  function runFeedback() {
    if (!sampleFn || (state.fb && state.fb.status === "loading")) return;

    renderFeedback();
    sampleFn.json(feedbackPrompt(), { signal: ctl.signal, cache: false }).then(function (v) {

      fbCtl = null;

  /* ---------- sanity check (reads the answers only, never predicts approval) ---------- */
  function repeats(texts) {
    var seen = {}, out = [];
    texts.forEach(function (x) {
      var k = x.t.trim().toLowerCase().replace(/\s+/g, " ");
      if (k.length < 25) return;
      if (!seen[k]) seen[k] = x;
      else if (seen[k].q !== x.q) out.push({ a: seen[k].q, b: x.q });
    });
    return out;
  }
  function clip(t) { t = String(t || ""); return t.length > 70 ? t.slice(0, 67).replace(/\s+\S*$/, "") + "..." : t; }
  function sanityList(title, items) {
    if (!items.length) return "";
    return "<h4>" + esc(title) + '</h4><ul class="flags">' + items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
  }
  function sanityHtml(s) {
    var ok = !s.thin.length && !s.advice.length && !s.repeats.length && !s.skipped.length;
    var other = s.flags.filter(function (f) { return f.indexOf("Short answer") !== 0 && f.indexOf("Continued after advice") !== 0; });
    var proofs = s.rows.filter(function (r) { return r.proof; }).length;
    var h = '<div class="block ' + (ok ? "ok" : "fix") + '" id="sanity" tabindex="-1" role="status"><h3>Sanity check</h3>';
    h += '<p class="verdict">' + (ok ? "Ready to submit" : "Strengthen these answers first") + "</p>";
    h += '<p class="help">This reads only what you wrote. It does not predict approval. Your approver also sees your budget and plan, which this page does not have.</p>';
    h += sanityList("Thin answers. Add names, dates, and numbers.", s.thin.map(function (x) { return "Q" + x.q + ": " + clip(x.what); }));
    h += sanityList("Repeated answers. Write something specific for each question.", s.repeats.map(function (x) { return "Q" + x.a + " and Q" + x.b + " have the same answer."; }));
    h += sanityList("Steps you skipped. Do them if you can. Your approver will see each one.", s.skipped.map(function (x) { return "Q" + x.q + ": " + x.title; }));
    h += sanityList("You continued after advice. Your approver will ask why.", s.advice.map(function (x) { return "Q" + x.q + ": " + x.text; }));
    h += sanityList("Your approver will also see", other);
    h += '<p class="help">You gave proof for ' + proofs + " question" + (proofs === 1 ? "" : "s") + ". Your reviewer will check each one.</p></div>";
    return h;
  }

  function render(focus) {
    if (state.cur !== "done") state.sanity = false;

    });

      var node = N[state.cur];
      html = node.kind === "stop" ? renderStop(node) : node.kind === "pause" ? renderPause(node) : renderQuestion(node);
    }
    app.innerHTML = html;
    if (state.tab === "try" && state.cur === "done") renderFeedback();
    if (focus) {
      var ta = app.querySelector("textarea[data-input], input[data-input]");
      var hd = app.querySelector('[tabindex="-1"]');
      if (ta && state.tab === "try") ta.focus({ preventScroll: true });
      else if (hd) hd.focus({ preventScroll: true });
    }
  }

  /* ---------- events ---------- */
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (!b) return;
    var a = b.getAttribute("data-action");
    if (a === "start") go(F.start);
    else if (a === "pick") pick(+b.getAttribute("data-i"));
    else if (a === "next") tryNext();
    else if (a === "back") back();
    else if (a === "return") returnFromPause();
    else if (a === "skip") continueFromPause();
    else if (a === "restart") restart();
    else if (a === "copy") copyText(summaryText(buildSummary()));
    else if (a === "copyjson") copyText(JSON.stringify(F, null, 2));
    else if (a === "sanity") showSanity();
    else if (a === "fb-run") runFeedback();
    else if (a === "fb-stop") stopFeedback();
  });
  if (paperEl) {
    paperEl.addEventListener("click", function (e) {
      var b = e.target.closest("[data-action]");
      if (b && b.getAttribute("data-action") === "download") offerDownload();
    });
  }
  app.addEventListener("input", function (e) {
    var t = e.target, kind = t.getAttribute("data-input");
    if (kind === "text") state.ans[state.cur] = t.value;
    else if (kind === "field") {
      var o = state.ans[state.cur] || (state.ans[state.cur] = {});
      o[t.getAttribute("data-f")] = t.value;
    } else if (kind === "note") state.notes[state.cur] = t.value;
    else if (kind === "skip") state.skips[state.cur] = t.value;
    else return;
    clearProblem();
  });
  tabsEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    state.tab = b.getAttribute("data-tab");
    render(true);
  });
  document.addEventListener("keydown", function (e) {
    if (state.tab !== "try") return;
    var t = e.target, typing = t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT");
    if (e.ctrlKey || e.metaKey) {
      if (typing && e.key === "Enter") { e.preventDefault(); if (N[state.cur] && N[state.cur].kind === "pause") { if (t.getAttribute("data-input") === "skip") continueFromPause(); else returnFromPause(); } else tryNext(); }
      return;
    }
    if (e.altKey || typing) return;
    var node = N[state.cur];
    if (!node || (node.kind !== "choice" && node.kind !== "multi")) return;
    var i = e.key.length === 1 ? LETTERS.indexOf(e.key.toUpperCase()) : -1;
    if (i >= 0 && i < node.options.length) { e.preventDefault(); pick(i); return; }
    if (e.key === "Enter" && t.tagName !== "BUTTON") { e.preventDefault(); tryNext(); }
  });

  renderPaper();
  render(false);
  if (CLAUDE_PAGE) {
    getCap("sample").then(function (fn) {
      if (!fn || typeof fn.json !== "function") return;
      sampleFn = fn;
      state.sampleOk = true;
      if (state.tab === "try" && state.cur === "done") renderFeedback();
    });
  }
})();

</script>
